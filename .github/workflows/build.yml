name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read build metadata
        id: build_metadata
        run: |
          sed -n -e '/^mod_version=/p' -e '/^minecraft_version=/p' gradle.properties >> "$GITHUB_OUTPUT"

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --console=plain

      - name: Test citizen work, logistics, food, and travel
        run: ./gradlew runGameTestServer --console=plain

      - name: Start, save, and reload a dedicated server
        run: python3 scripts/smoke_server.py

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: wwmc-${{ steps.build_metadata.outputs.mod_version }}-neoforge-mc${{ steps.build_metadata.outputs.minecraft_version }}
          path: build/libs/wwmc-${{ steps.build_metadata.outputs.mod_version }}.jar
          if-no-files-found: error
